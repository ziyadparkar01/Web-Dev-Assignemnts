
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar and Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2>My Portfolio</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>
        <h1>Welcome to My Portfolio</h1>
        <p>Learning CSS positioning with a sticky navbar and overlay card.</p>

        <section class="container">
            <div class="card">
                <h2>My Project</h2>
                <p>This is a simple project card.</p>

                <div class="overlay">
                    <h3>Project Details</h3>
                    <p>Created using HTML and CSS.</p>
                </div>
            </div>
        </section>

        <section class="extra">
            <h2>More Content</h2>
            <p>Scroll down to see how the navbar stays at the top.</p>
        </section>
    </main>

</body>
</html>
